<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <defs>
    <clipPath id="room"><rect x="45" y="45" width="590" height="350"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="40" y="40">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#e4e4e4" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Grid: 1 square = 400 world units -->
  <rect x="40" y="40" width="720" height="360" fill="url(#grid)"/>

  <!-- Vision cone of guard 1 (90 degrees, 1800 units) -->
  <path d="M290 150 L417 23 A180 180 0 0 1 417 277 Z" fill="#d11" fill-opacity="0.18" stroke="#d11" stroke-width="1" clip-path="url(#room)"/>

  <!-- Furniture (cover) -->
  <rect x="160" y="60" width="300" height="40" fill="#555"/>
  <text x="310" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">BAR</text>
  <rect x="45" y="140" width="75" height="120" fill="#bbb"/>
  <text x="82" y="204" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">STAGE</text>
  <circle cx="200" cy="245" r="25" fill="#bbb"/>
  <circle cx="340" cy="255" r="25" fill="#bbb"/>
  <circle cx="480" cy="245" r="25" fill="#bbb"/>
  <text x="340" y="300" font-size="10" fill="#666" text-anchor="middle">tables</text>
  <rect x="650" y="190" width="40" height="40" fill="#bbb"/>
  <text x="670" y="247" font-size="10" fill="#666" text-anchor="middle">crates</text>

  <!-- Patrol route guard 1 -->
  <polygon points="180,150 570,150 570,340 180,340" fill="none" stroke="#d11" stroke-width="2" stroke-dasharray="7 5"/>
  <g font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="173" y="143" width="14" height="14" fill="#d11"/><text x="180" y="154">1</text>
    <rect x="563" y="143" width="14" height="14" fill="#d11"/><text x="570" y="154">2</text>
    <rect x="563" y="333" width="14" height="14" fill="#d11"/><text x="570" y="344">3</text>
    <rect x="173" y="333" width="14" height="14" fill="#d11"/><text x="180" y="344">4</text>
  </g>

  <!-- Guard 1 -->
  <rect x="272" y="132" width="36" height="36" fill="#d11"/>
  <text x="290" y="125" font-size="11" fill="#d11" text-anchor="middle" font-weight="bold">Guard</text>

  <!-- Guard 2, optional -->
  <line x1="728" y1="90" x2="728" y2="350" stroke="#d11" stroke-width="2" stroke-dasharray="3 5"/>
  <rect x="710" y="110" width="36" height="36" fill="none" stroke="#d11" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="728" y="372" font-size="9" fill="#d11" text-anchor="middle">Guard 2,</text>
  <text x="728" y="383" font-size="9" fill="#d11" text-anchor="middle">if time allows</text>

  <!-- Player start -->
  <circle cx="85" cy="355" r="21" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="85" y="360" font-size="13" text-anchor="middle" font-weight="bold">P</text>
  <text x="115" y="372" font-size="10" fill="#222">start</text>

  <!-- Walls (100 units thick) -->
  <g stroke="#000" stroke-width="10" stroke-linecap="square" fill="none">
    <path d="M40 40 L670 40"/>
    <path d="M730 40 L760 40 L760 400 L40 400 L40 40"/>
    <path d="M640 40 L640 290"/>
    <path d="M640 370 L640 400"/>
  </g>

  <!-- Labels -->
  <text x="700" y="30" font-size="13" fill="#d11" text-anchor="middle" font-weight="bold">EXIT</text>
  <text x="340" y="30" font-size="12" fill="#222" text-anchor="middle">Main room</text>
  <text x="600" y="328" font-size="9" fill="#222" text-anchor="end">door</text>
  <text x="700" y="415" font-size="10" fill="#222" text-anchor="middle">Back corridor</text>

  <!-- Legend -->
  <g font-size="11" fill="#222">
    <line x1="40" y1="450" x2="64" y2="450" stroke="#000" stroke-width="8"/><text x="72" y="454">Wall</text>
    <rect x="115" y="442" width="16" height="16" fill="#bbb"/><text x="137" y="454">Furniture (cover)</text>
    <rect x="245" y="442" width="16" height="16" fill="#d11"/><text x="267" y="454">Guard</text>
    <line x1="315" y1="450" x2="345" y2="450" stroke="#d11" stroke-width="2" stroke-dasharray="7 5"/><text x="352" y="454">Patrol route and waypoints</text>
    <path d="M530 450 L552 440 L552 460 Z" fill="#d11" fill-opacity="0.25" stroke="#d11"/><text x="560" y="454">Vision cone</text>
    <circle cx="655" cy="450" r="8" fill="#fff" stroke="#000" stroke-width="2"/><text x="668" y="454">Player</text>
    <text x="40" y="482" fill="#666" font-size="10">One grid square = 400 world units, about one player width. Level: 18 x 9 squares (7200 x 3600 units).</text>
  </g>
</svg>
